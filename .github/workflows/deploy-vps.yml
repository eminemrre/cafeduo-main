name: Deploy VPS

on:
  workflow_run:
    workflows: ['CI/CD Pipeline']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.58.1-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Verify checked-out repository in container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --verify HEAD
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify pinned SSH connection
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?DEPLOY_HOST missing}" "${DEPLOY_USER:?DEPLOY_USER missing}" "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY missing}"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "${DEPLOY_PORT:-22}" =~ ^[0-9]+$ ]]
          install -d -m 700 ~/.ssh
          python3 deploy/scripts/prepare-ssh-key.py ~/.ssh/deploy_key
          install -m 600 deploy/ssh_known_hosts ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null
          cat > ~/.ssh/config <<CONFIG
          Host production
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port ${DEPLOY_PORT:-22}
            IdentityFile $HOME/.ssh/deploy_key
            UserKnownHostsFile $HOME/.ssh/known_hosts
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          CONFIG
          chmod 600 ~/.ssh/config
          ssh -F "$HOME/.ssh/config" -o ConnectTimeout=15 production true
          echo "[deploy] SSH authentication verified."
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate dependencies and application
        run: npm run verify
      - name: Verify smoke flows before deployment
        run: |
          npm run test:e2e:smoke -- --reporter=line
      - name: Check the private word bank
        env:
          # gzip + base64 of the ranked Adam Asmaca bank (kept out of the public repo).
          WORD_BANK_GZ_B64: ${{ secrets.WORD_BANK_GZ_B64 }}
        run: |
          set -euo pipefail
          : "${WORD_BANK_GZ_B64:?WORD_BANK_GZ_B64 secret missing}"
          install -d -m 700 "$RUNNER_TEMP/word-bank"
          printf '%s' "$WORD_BANK_GZ_B64" | base64 -d | gunzip > "$RUNNER_TEMP/word-bank/words.json"
          node scripts/ops/check-word-bank.cjs "$RUNNER_TEMP/word-bank/words.json"
      - name: Check the e-mail key
        env:
          # Resend sending key (sending_access, cafeduotr.com only).
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          : "${RESEND_API_KEY:?RESEND_API_KEY secret missing}"
          [[ "$RESEND_API_KEY" =~ ^re_[[:alnum:]_]+$ ]] || { echo 'RESEND_API_KEY has an unexpected format'; exit 1; }
          install -d -m 700 "$RUNNER_TEMP/app-secrets"
          umask 077
          printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY" > "$RUNNER_TEMP/app-secrets/app.env"
      - name: Transfer the verified source and deploy
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://cafeduotr.com' }}
        run: |
          set -euo pipefail
          path="${DEPLOY_PATH:-/opt/cafeduo-main}"
          [[ "$path" =~ ^/opt/[a-zA-Z0-9_/-]+$ ]]
          [[ "$PRODUCTION_URL" =~ ^https://[a-zA-Z0-9.-]+$ ]]
          sha="$(git rev-parse HEAD)"
          release="/opt/cafeduo-releases/$sha"
          ssh -F "$HOME/.ssh/config" production "umask 077; mkdir -p '$release'"
          # The API container (non-root) reads the bank through a read-only bind mount.
          ssh -F "$HOME/.ssh/config" production "install -d -m 755 /opt/cafeduo-secrets && cat > /opt/cafeduo-secrets/words.json.next && chmod 644 /opt/cafeduo-secrets/words.json.next && mv -f /opt/cafeduo-secrets/words.json.next /opt/cafeduo-secrets/words.json" < "$RUNNER_TEMP/word-bank/words.json"
          rm -f "$RUNNER_TEMP/word-bank/words.json"
          # Deploy-managed secrets; deploy-production.sh merges them into the release .env.
          ssh -F "$HOME/.ssh/config" production "install -d -m 755 /opt/cafeduo-secrets && umask 077 && cat > /opt/cafeduo-secrets/app.env.next && mv -f /opt/cafeduo-secrets/app.env.next /opt/cafeduo-secrets/app.env" < "$RUNNER_TEMP/app-secrets/app.env"
          rm -f "$RUNNER_TEMP/app-secrets/app.env"
          git archive HEAD | ssh -F "$HOME/.ssh/config" production "tar -xf - -C '$release'"
          ssh -F "$HOME/.ssh/config" production "bash '$release/deploy/scripts/deploy-production.sh' '$path' '$sha' '$PRODUCTION_URL'"
      - name: Verify the public deployed revision
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://cafeduotr.com' }}
        run: |
          EXPECTED_SHA="$(git rev-parse HEAD)" python3 - <<'PYVERIFY'
          import json,os,urllib.request
          url=os.environ['PRODUCTION_URL'].rstrip('/')+'/api/readiness'
          with urllib.request.urlopen(url,timeout=20) as response:
              body=json.load(response)
          assert body['status']=='ready' and body['version']==os.environ['EXPECTED_SHA']
          assert body['checks']['database'] is True and body['checks']['redis']['ready'] is True
          assert body['checks'].get('wordBank') is True, 'Adam Asmaca word bank is not loaded'
          assert body['checks'].get('email') is True, 'No e-mail provider: password reset and verification would not be sent'
          print('[deploy] Public deployed revision and readiness verified.')
          PYVERIFY
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-verification
          path: |
            coverage/coverage-summary.json
            playwright-report/
          retention-days: 14
