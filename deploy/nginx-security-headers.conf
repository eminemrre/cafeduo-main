# Include wherever a location declares add_header: nginx replaces inherited headers.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Public TLS terminates at Caddy/Traefik. Browsers ignore HSTS over plain HTTP.
# Do not opt other subdomains into HSTS or request preload here.
add_header Strict-Transport-Security "max-age=31536000" always;
# Pixi's shader/uniform generation needs unsafe-eval; React/Leaflet use inline styles.
# API/socket/Sentry hosts are build-time configurable, so HTTPS/WSS connections remain allowed.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https://api.dicebear.com https://unpkg.com https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https: wss: http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:*; worker-src 'self' blob:; media-src 'self' blob:; manifest-src 'self'" always;
# Preserve same-origin check-in location and camera access; no microphone/payment use.
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(), payment=()" always;
