name: Deploy VPS

on:
  workflow_run:
    workflows: ['CI/CD Pipeline']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate dependencies and application
        run: npm run verify
      - name: Verify smoke flows before deployment
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e:smoke -- --reporter=line
      - name: Configure pinned SSH connection
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?DEPLOY_HOST missing}" "${DEPLOY_USER:?DEPLOY_USER missing}" "${DEPLOY_SSH_KEY:?DEPLOY_SSH_KEY missing}"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "${DEPLOY_PORT:-22}" =~ ^[0-9]+$ ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          install -m 600 deploy/ssh_known_hosts ~/.ssh/known_hosts
          ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null
          cat > ~/.ssh/config <<CONFIG
          Host production
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port ${DEPLOY_PORT:-22}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          CONFIG
      - name: Transfer the verified source and deploy
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://cafeduotr.com' }}
        run: |
          set -euo pipefail
          path="${DEPLOY_PATH:-/opt/cafeduo-main}"
          [[ "$path" =~ ^/opt/[a-zA-Z0-9_/-]+$ ]]
          [[ "$PRODUCTION_URL" =~ ^https://[a-zA-Z0-9.-]+$ ]]
          sha="$(git rev-parse HEAD)"
          release="/opt/cafeduo-releases/$sha"
          ssh production "umask 077; mkdir -p '$release'"
          git archive HEAD | ssh production "tar -xf - -C '$release'"
          ssh production "bash '$release/deploy/scripts/deploy-production.sh' '$path' '$sha' '$PRODUCTION_URL'"
      - name: Verify the public deployed revision
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://cafeduotr.com' }}
        run: |
          sha="$(git rev-parse HEAD)"
          curl --fail --silent --show-error "$PRODUCTION_URL/api/readiness" | jq -e --arg sha "$sha" '.status == "ready" and .version == $sha and .checks.database == true and .checks.redis.ready == true'
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-verification
          path: |
            coverage/coverage-summary.json
            playwright-report/
          retention-days: 14
