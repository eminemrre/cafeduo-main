openapi: 3.0.3
info:
  title: CafeDuo API
  description: |
    Gamified cafe loyalty platform API

    CafeDuo, kafelerde oyun oynayarak puan kazanmayı ve bu puanlarla 
    ödüller satın almayı sağlayan bir platformun backend API'sidir.

    ## Özellikler
    - 🎮 Oyun lobisi (Retro Satranç, Bilgi Yarışı, Nişancı Düellosu, Amiral Battı)
    - 🛡️ Sıralı oyunlarda sunucu otoritesi (`POST /api/games/{id}/actions`)
    - 🏆 Liderlik tablosu
    - 🎁 Ödül mağazası
    - ☕ Kafe check-in sistemi
    - 📊 Başarım sistemi

  version: 1.0.0
  contact:
    name: CafeDuo Support
    email: support@cafeduo.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3001
    description: Local development server
  - url: https://cafeduotr.com
    description: Production server

security:
  - BearerAuth: []

tags:
  - name: Authentication
    description: Kullanıcı kayıt, giriş ve doğrulama işlemleri
  - name: Users
    description: Kullanıcı profili ve envanter yönetimi
  - name: Games
    description: Oyun lobisi ve oyun yönetimi
  - name: Shop
    description: Mağaza ve ödül işlemleri
  - name: Cafes
    description: Kafe listesi ve check-in işlemleri
  - name: Leaderboard
    description: Liderlik tablosu
  - name: Achievements
    description: Başarım sistemi
  - name: Coupons
    description: Kupon kullanımı (Kafe Admin)
  - name: Admin
    description: Yönetici paneli işlemleri
  - name: Health
    description: Sağlık kontrolü

paths:
  # ==========================================
  # AUTHENTICATION
  # ==========================================
  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Yeni kullanıcı kaydı
      description: E-posta doğrulaması olmadan doğrudan kayıt oluşturur
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
              properties:
                username:
                  type: string
                  example: 'gamer123'
                email:
                  type: string
                  format: email
                  example: 'user@example.com'
                password:
                  type: string
                  format: password
                  minLength: 6
                  example: 'securePass123'
                department:
                  type: string
                  example: 'Bilgisayar Mühendisliği'
      responses:
        200:
          description: Kayıt başarılı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        400:
          description: Eksik alan veya kullanımda e-posta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        500:
          description: Sunucu hatası

  /api/auth/verify:
    post:
      tags:
        - Authentication
      summary: E-posta doğrulama kodu kontrolü
      description: E-posta doğrulama kodunu kontrol eder ve kullanıcı oluşturur
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - code
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  example: '123456'
      responses:
        200:
          description: Doğrulama başarılı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        400:
          description: Geçersiz kod veya oturum zaman aşımı

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Kullanıcı girişi
      description: E-posta ve şifre ile giriş yapar, JWT token döndürür
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: 'user@example.com'
                password:
                  type: string
                  format: password
                  example: 'securePass123'
                captchaToken:
                  type: string
                  description: Google reCAPTCHA token (opsiyonel)
      responses:
        200:
          description: Giriş başarılı
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
                    example: 'eyJhbGciOiJIUzI1NiIs...'
                  bonusReceived:
                    type: boolean
                    description: Günlük bonus alındı mı?
        401:
          description: Geçersiz e-posta veya şifre
        400:
          description: reCAPTCHA doğrulaması başarısız

  /api/auth/me:
    get:
      tags:
        - Authentication
      summary: Mevcut kullanıcı bilgileri
      description: JWT token'dan kullanıcı bilgilerini getirir
      responses:
        200:
          description: Kullanıcı bilgileri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        401:
          description: Token eksik
        403:
          description: Token geçersiz veya süresi dolmuş
        404:
          description: Kullanıcı bulunamadı

  # ==========================================
  # USERS
  # ==========================================
  /api/users/{id}:
    put:
      tags:
        - Users
      summary: Kullanıcı bilgilerini güncelle
      description: Puan, galibiyet ve oyun sayısını günceller
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                points:
                  type: integer
                  example: 1500
                wins:
                  type: integer
                  example: 10
                gamesPlayed:
                  type: integer
                  example: 25
                department:
                  type: string
                  example: 'Endüstri Mühendisliği'
      responses:
        200:
          description: Güncelleme başarılı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        401:
          description: Yetkilendirme hatası
        403:
          description: Kaynağa erişim izni yok
        404:
          description: Kullanıcı bulunamadı

  /api/users/{id}/profile:
    patch:
      tags: [Users]
      summary: Bölüm veya avatar tercihini güncelle
      description: |
        Yalnızca gönderilen profil alanlarını değiştirir; puan, galibiyet ve oyun
        sayısını korur. Oturum ve kaynak sahipliği kontrol edilir. X-CSRF-Token
        başlığı csrf_token cookie değeriyle eşleşmelidir.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                department:
                  type: string
                  maxLength: 120
                avatar_url:
                  type: string
                  nullable: true
                  pattern: '^https://api\.dicebear\.com/9\.x/pixel-art/svg\?seed=[A-Za-z0-9_-]{1,32}$|^$'
                  description: DiceBear v9 pixel-art URL; null veya boş string baş harflere sıfırlar.
      responses:
        200:
          description: Güncel istatistikleri de içeren sunucu onaylı kullanıcı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        400:
          description: Boş payload, ilgisiz alan veya geçersiz bölüm/avatar
        401:
          description: Oturum gerekli
        403:
          description: Kaynak sahipliği veya CSRF kontrolü başarısız
        404:
          description: Kullanıcı bulunamadı
        500:
          description: Kayıt başarısız; onaylı kullanıcı bilgisi korunmalıdır

  /api/users/{id}/items:
    get:
      tags:
        - Users
      summary: Kullanıcı kuponlarını getir
      description: Son 5 gün içindeki aktif kuponları listeler
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Kupon listesi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserItem'
        401:
          description: Yetkilendirme hatası
        403:
          description: Kaynağa erişim izni yok

  /api/users/{username}/active-game:
    get:
      tags:
        - Users
      summary: Kullanıcının aktif oyununu getir
      description: Kullanıcının oynadığı aktif bir oyun varsa döndürür
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Aktif oyun veya null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Game'
                  - type: 'null'

  # ==========================================
  # GAMES
  # ==========================================
  /api/games:
    get:
      tags:
        - Games
      summary: Bekleyen oyunları listele
      description: Status'ü 'waiting' olan tüm oyunları getirir
      security: []
      responses:
        200:
          description: Oyun listesi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Game'

    post:
      tags:
        - Games
      summary: Yeni oyun oluştur
      description: Yeni bir oyun lobisi oluşturur (host auth token içinden alınır)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - gameType
              properties:
                gameType:
                  type: string
                  enum: ['Retro Satranç', 'Bilgi Yarışı', 'Nişancı Düellosu', 'Amiral Battı', 'Adam Asmaca', 'Çiz Bil']
                  example: 'Amiral Battı'
                points:
                  type: integer
                  minimum: 0
                  maximum: 5000
                  example: 150
                table:
                  type: string
                  example: 'MASA04'
                chessClock:
                  type: object
                  properties:
                    baseSeconds:
                      type: integer
                      minimum: 60
                      maximum: 1800
                      example: 180
                    incrementSeconds:
                      type: integer
                      minimum: 0
                      maximum: 30
                      example: 2
      responses:
        201:
          description: Oyun oluşturuldu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        400:
          description: Doğrulama hatası
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        401:
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        500:
          description: Sunucu hatası
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/games/{id}:
    get:
      tags:
        - Games
      summary: Oyun detaylarını getir
      description: Belirli bir oyunun detaylarını döndürür
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Oyun detayları
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        404:
          description: Oyun bulunamadı

    delete:
      tags:
        - Games
      summary: Oyunu sil
      description: Bir oyunu tamamen siler
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Oyun silindi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /api/games/{id}/join:
    post:
      tags:
        - Games
      summary: Oyuna katıl
      description: Bir oyuna misafir olarak katılır (guest auth token içinden alınır)
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Katılım başarılı
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        400:
          description: Doğrulama hatası
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        401:
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        409:
          description: Oyun durum geçişi geçersiz veya oyun dolu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameStatusTransitionError'

  /api/games/{id}/strokes:
    get:
      tags:
        - Games
      summary: Çiz Bil turunun çizimini yeniden oynat
      description: |
        Yalnız oyunun iki oyuncusu (ya da yönetici) için. Sayfa yenilenince veya bağlantı koptuğunda
        geçerli turun çizgilerini sırasıyla döner. Canlı çizgiler Socket.IO `draw_strokes` olayıyla
        gelir; çizgiler puanı, kelimeyi ya da süreyi değiştiremez.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          description: Geçerli turun çizgileri (çizim başlamadıysa boş)
          content:
            application/json:
              schema:
                type: object
                properties:
                  roundId:
                    type: string
                    nullable: true
                    example: 'r2'
                  ops:
                    type: array
                    items:
                      type: object
                      required: [t]
                      properties:
                        t: { type: string, enum: ['line', 'clear'] }
                        id: { type: integer, minimum: 0, maximum: 9999 }
                        c: { type: integer, minimum: 0, maximum: 7, description: Renk sırası }
                        w: { type: integer, minimum: 0, maximum: 2, description: Kalınlık sırası }
                        p:
                          type: array
                          description: Tuval birimi (0-1000) tamsayı noktalar
                          items:
                            type: array
                            minItems: 2
                            maxItems: 2
                            items: { type: integer, minimum: 0, maximum: 1000 }
        400:
          description: Oyun Çiz Bil değil (NOT_A_DRAW_GAME)
        403:
          description: Oyunun oyuncusu değil
        404:
          description: Oyun bulunamadı

  /api/games/{id}/actions:
    post:
      tags:
        - Games
      summary: Sıralı oyun eylemi (protokol v2)
      description: |
        Bilgi Yarışı, Nişancı Düellosu, Amiral Battı, Adam Asmaca ve Çiz Bil için tek eylem yolu. Sunucu skoru, isabeti,
        süreyi ve kazananı kendisi hesaplar; istemcinin gönderdiği skor/kazanan alanları yok sayılır.
        Aynı `actionId` ve aynı gövdeyle tekrar saklanan makbuzu döner (`duplicate: true`);
        aynı `actionId` ile farklı gövde `409 ACTION_ID_CONFLICT` olur.
        Ayrıntılar: `docs/ops/game-engine-v2.md`.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actionId, roundId, type]
              properties:
                actionId:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{8,64}$'
                roundId:
                  type: string
                  pattern: '^r[1-9][0-9]{0,2}$'
                  example: 'r1'
                type:
                  type: string
                  enum: ['answer', 'joker', 'fire', 'place', 'guess', 'solve', 'pick', 'report', 'resign']
                optionIndex:
                  type: integer
                  minimum: 0
                  maximum: 7
                  description: Bilgi Yarışı `answer`; Çiz Bil `pick` (0-2, çizenin üç kelimesinden biri).
                shotAt:
                  type: integer
                  description: >-
                    Nişancı `fire`: ekrandaki nişangah karesinin sunucu-saati zamanı (epoch ms).
                    Sunucu bunu alış anından en fazla 250 ms geriye ve tur başına kırpar.
                cell:
                  type: integer
                  minimum: 0
                  maximum: 63
                  description: Amiral Battı `fire` hedef karesi (8×8, satır × 8 + sütun).
                layout:
                  type: array
                  description: Amiral Battı `place`; filo sırasıyla (4, 3, 3, 2) gemi başı ve yön.
                  items:
                    type: object
                    required: [cell, dir]
                    properties:
                      cell: { type: integer, minimum: 0, maximum: 63 }
                      dir: { type: string, enum: ['h', 'v'] }
                auto:
                  type: boolean
                  description: Amiral Battı `place`; sunucunun tohumladığı düzenle yerleştir (`layout` ile birlikte gönderilemez).
                letter:
                  type: string
                  pattern: '^[a-zA-ZçğıöşüÇĞİÖŞÜ]$'
                  description: Adam Asmaca `guess`; tek Türkçe harf (I → ı, İ → i).
                  example: 'ş'
                word:
                  type: string
                  maxLength: 24
                  description: >-
                    Adam Asmaca ve Çiz Bil `solve`; kelimenin tamamı. Adam Asmaca'da yanlışsa iki hak
                    gider; Çiz Bil'de tahmin günlüğüne yazılır (tur başına en fazla 40). Sunucu
                    Türkçe küçük harfe çevirip harf dışı karakterleri atar.
                  example: 'kahve'
      responses:
        200:
          description: Eylem uygulandı ya da aynı eylemin makbuzu döndü
          content:
            application/json:
              schema:
                type: object
                properties:
                  duplicate:
                    type: boolean
                  game:
                    $ref: '#/components/schemas/Game'
        400:
          description: Geçersiz eylem gövdesi (ör. INVALID_CELL, INVALID_LAYOUT, INVALID_SHOT_TIME)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        401:
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        409:
          description: Eski/gelecek tur, ikinci eylem, sıra rakipte ya da ACTION_ID_CONFLICT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        503:
          description: GAME_ENGINE_MAINTENANCE — sıralı oyunlar geçici olarak kapalı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/games/{id}/move:
    post:
      tags:
        - Games
      summary: Hamle yap
      description: Oyun içinde tek bir hamle türü gönderir (chessMove/liveSubmission/scoreSubmission/gameState/move)
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                player:
                  type: string
                  enum: ['host', 'guest']
                  description: Oyuncu rolü
                move:
                  type: string
                  maxLength: 64
                  description: Legacy hamle alanı
                chessMove:
                  type: object
                  required: [from, to]
                  properties:
                    from:
                      type: string
                      pattern: '^[a-h][1-8]$'
                      example: e2
                    to:
                      type: string
                      pattern: '^[a-h][1-8]$'
                      example: e4
                    promotion:
                      type: string
                      enum: [q, r, b, n]
                gameState:
                  type: object
                  description: Oyun durumu (JSON)
                scoreSubmission:
                  type: object
                  properties:
                    username:
                      type: string
                    score:
                      type: integer
                    roundsWon:
                      type: integer
                    durationMs:
                      type: integer
                    submissionKey:
                      type: string
                liveSubmission:
                  type: object
                  properties:
                    mode:
                      type: string
                    score:
                      type: integer
                    roundsWon:
                      type: integer
                    round:
                      type: integer
                    done:
                      type: boolean
                    submissionKey:
                      type: string
              oneOf:
                - required: [chessMove]
                - required: [liveSubmission]
                - required: [scoreSubmission]
                - required: [gameState]
                - required: [move]
      responses:
        200:
          description: Hamle kaydedildi
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        400:
          description: Doğrulama hatası
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        401:
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        409:
          description: Oyun aktif olmadığı için hamle reddedildi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameStatusTransitionError'

  /api/games/{id}/finish:
    post:
      tags:
        - Games
      summary: Oyunu bitir
      description: Oyunu sonlandırır ve kazananı belirler
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                winner:
                  type: string
                  description: Kazananın kullanıcı adı
                  example: 'GamerTr_99'
      responses:
        200:
          description: Oyun sonlandırıldı
        409:
          description: Oyun durum geçişi veya finalizasyon kuralı geçersiz
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameStatusTransitionError'

  # ==========================================
  # SHOP
  # ==========================================
  /api/shop/buy:
    post:
      tags:
        - Shop
      summary: Ödül satın al
      description: Puan kullanarak mağazadan ödül satın alır
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - item
              properties:
                item:
                  type: object
                  required:
                    - id
                    - title
                    - cost
                  properties:
                    id:
                      type: integer
                    title:
                      type: string
                    cost:
                      type: integer
                    icon:
                      type: string
      responses:
        200:
          description: Satın alma başarılı
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  newPoints:
                    type: integer
                  reward:
                    $ref: '#/components/schemas/UserItem'
        400:
          description: Yetersiz puan veya geçersiz ürün
        401:
          description: Yetkilendirme hatası

  /api/shop/inventory/{userId}:
    get:
      tags:
        - Shop
      summary: Envanteri getir
      description: Kullanıcının satın aldığı ödülleri listeler
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Envanter listesi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryItem'
        401:
