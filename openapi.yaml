# ==========================================
# COMPONENTS
# ==========================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token kullanarak yetkilendirme.
        Token'ı `Authorization: Bearer <token>` header'ında gönderin.

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: 'GamerTr_99'
        email:
          type: string
          format: email
          example: 'user@example.com'
        points:
          type: integer
          example: 1250
        wins:
          type: integer
          example: 12
        gamesPlayed:
          type: integer
          example: 25
        department:
          type: string
          example: 'Bilgisayar Mühendisliği'
        role:
          type: string
          enum: ['user', 'cafe_admin', 'admin']
          example: 'user'
        isAdmin:
          type: boolean
          example: false
        cafe_id:
          type: integer
          nullable: true
        table_number:
          type: string
          nullable: true
          example: 'MASA05'
        cafe_name:
          type: string
          nullable: true
        avatar_url:
          type: string
          nullable: true
          format: uri
      required:
        - id
        - username
        - email
        - points

    Game:
      type: object
      properties:
        id:
          type: integer
          example: 1
        hostName:
          type: string
          example: 'GamerTr_99'
        guestName:
          type: string
          nullable: true
          example: 'Rival_Pro'
        gameType:
          type: string
          example: 'Amiral Battı'
        points:
          type: integer
          example: 150
        table:
          type: string
          example: 'MASA04'
        status:
          type: string
          enum: ['waiting', 'active', 'finishing', 'finished']
          example: 'waiting'
        player1Move:
          type: string
          nullable: true
        player2Move:
          type: string
          nullable: true
        gameState:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time
        cafe_name:
          type: string
          nullable: true
      required:
        - id
        - hostName
        - gameType
        - points
        - status

    GameStatusTransitionError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          properties:
            code:
              type: string
              enum: ['invalid_game_status', 'invalid_target_status', 'invalid_status_transition']
              example: 'invalid_status_transition'
            details:
              type: object
              properties:
                fromStatus:
                  type: string
                  example: 'finished'
                toStatus:
                  type: string
                  example: 'active'

    Reward:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: 'Bedava Filtre Kahve'
        cost:
          type: integer
          example: 500
        description:
          type: string
          example: 'Günün yorgunluğunu at.'
        icon:
          type: string
          example: 'coffee'
        cafe_id:
          type: integer
          nullable: true
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
      required:
        - id
        - title
        - cost

    UserItem:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        item_id:
          type: integer
        item_title:
          type: string
        code:
          type: string
          example: 'CD-A1B2-C3D4'
        redeemed_at:
          type: string
          format: date-time
        is_used:
          type: boolean
        used_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum: ['active', 'used']

    StoreItem:
      type: object
      properties:
        id:
          type: integer
          example: 2
        title:
          type: string
          example: 'Hacker Çerçevesi (Kırmızı)'
        code:
          type: string
          example: 'FRAME_HACKER_RED'
        price:
          type: integer
          example: 1000
        type:
          type: string
          enum: ['rank', 'frame', 'title', 'animation']
        description:
          type: string
      required:
        - id
        - title
        - code
        - price
        - type

    InventoryItem:
      type: object
      properties:
        redeemId:
          type: integer
        id:
          type: integer
        title:
          type: string
        code:
          type: string
          example: 'CD-A1B2-C3D4'
        redeemedAt:
          type: string
          format: date-time
        isUsed:
          type: boolean

    Cafe:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'PAÜ İİBF Kantin'
        address:
          type: string
          nullable: true
        total_tables:
          type: integer
          example: 30
        pin:
          type: string
          example: '1234'
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        table_count:
          type: integer
        radius:
          type: integer
          description: Metre cinsinden
        daily_pin:
          type: string
          example: '1234'
      required:
        - id
        - name

    LeaderboardEntry:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
          example: 'GamerTr_99'
        points:
          type: integer
          example: 2500
        wins:
          type: integer
          example: 50
        gamesPlayed:
          type: integer
          example: 100
        department:
          type: string
          example: 'Bilgisayar Mühendisliği'
      required:
        - id
        - username
        - points

    Achievement:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
          example: 'İlk Adım'
        description:
          type: string
          example: 'İlk oyununu oyna.'
        icon:
          type: string
          example: 'footsteps'
        points_reward:
          type: integer
          example: 50
        condition_type:
          type: string
          enum: ['wins', 'games_played', 'points']
        condition_value:
          type: integer
          example: 1
        unlocked:
          type: boolean
          example: true
        unlockedAt:
          type: string
          format: date-time
          nullable: true

    ApiError:
      type: object
      properties:
        code:
          type: string
          example: 'TOKEN_MISSING'
        message:
          type: string
          example: 'Access token required'
        details:
          nullable: true
        requestId:
          type: string
          nullable: true
          example: '1b4f4f2e-3703-47ef-a2f4-8f84efff2f0a'
        error:
          type: string
          description: message alanı için backward-compatible alias
          example: 'Access token required'
      required:
        - code
        - message

    ValidationError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          properties:
            code:
              type: string
              enum: ['VALIDATION_ERROR']
            details:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                    example: 'body.points'
                  message:
                    type: string
                    example: 'points 0 ile 5000 arasında sayı olmalıdır.'
                  value:
                    nullable: true

    Error:
      allOf:
        - $ref: '#/components/schemas/ApiError'
