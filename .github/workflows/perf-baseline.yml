name: Perf Baseline

on:
  workflow_dispatch:
  schedule:
    # Daily is enough to spot regressions; 03:00 is taken by the Playwright run.
    - cron: '0 4 * * *'

jobs:
  api-p95:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API P95 probe
        env:
          PERF_BASE_URL: ${{ secrets.DEPLOY_SITE_URL }}
          PERF_REQUESTS: 25
          PERF_HEALTH_P95_MAX_MS: 900
          PERF_META_P95_MAX_MS: 350
          PERF_LOGIN_P95_MAX_MS: 600
          PERF_AUTH_ME_P95_MAX_MS: 700
          PERF_GAMES_P95_MAX_MS: 900
          PERF_LOGIN_EMAIL: ${{ secrets.SMOKE_LOGIN_EMAIL }}
          PERF_LOGIN_PASSWORD: ${{ secrets.SMOKE_LOGIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${PERF_BASE_URL:-}" ]; then
            PERF_BASE_URL="https://cafeduotr.com"
          fi
          npm run perf:api-p95

      - name: Upload perf artifacts
        uses: actions/upload-artifact@v7
        with:
          name: api-p95-report
          path: docs/reports/api-p95-latest.*
          if-no-files-found: error
