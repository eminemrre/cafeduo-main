name: Playwright Tests

# Push'taki e2e smoke artık CI/CD Pipeline (ci.yml) içinde koşuyor; burada
# tekrar koşmamak için push/PR trigger'ı kaldırıldı. Bu workflow nightly
# (schedule) ve manuel (workflow_dispatch) çalışır — advanced realtime dahil.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  smoke-critical:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # Resmi Playwright imajı: tarayıcı + OS bağımlılıkları hazır (apt takılması yok).
    container:
      image: mcr.microsoft.com/playwright:v1.58.1-jammy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install chromium
      - name: Run smoke-critical Playwright tests
        run: npx playwright test --project=chromium --grep @smoke
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          E2E_API_BASE_URL: http://127.0.0.1:3001
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 30

  advanced-v2:
    # Full server-authoritative match flow. Production keeps the flag off;
    # this job starts an isolated E2E stack with it on.
    continue-on-error: true
    timeout-minutes: 45
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.1-jammy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install chromium
      - name: Run protocol v2 Playwright tests
        run: npx playwright test --project=chromium --grep @v2
        env:
          GAME_ENGINE_V2_ENABLED: 'true'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          E2E_API_BASE_URL: http://127.0.0.1:3001
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-v2
          path: playwright-report/
          retention-days: 30

  advanced-realtime:
    continue-on-error: true
    timeout-minutes: 45
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.1-jammy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install chromium
      - name: Run advanced realtime Playwright tests
        run: npx playwright test --project=chromium --grep @advanced
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          E2E_API_BASE_URL: http://127.0.0.1:3001
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-advanced
          path: playwright-report/
          retention-days: 30
