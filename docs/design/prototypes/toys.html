<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#1FB3FF;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const params = new URLSearchParams(location.search);
const field = params.get('bg') || '#1FB3FF';
const scene = new THREE.Scene();
scene.background = new THREE.Color(field);
const W = innerWidth, H = innerHeight;
const camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
camera.position.set(0, Number(params.get('cy') || 7.5), Number(params.get('cz') || 11.5));
camera.lookAt(Number(params.get('lx') || 0), 0.9, 0);
camera.fov = Number(params.get('fov') || 30); camera.updateProjectionMatrix();
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Number(params.get('dpr') || 2));
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight('#ffffff', field, 1.6));
const key = new THREE.DirectionalLight('#ffffff', 2.4);
key.position.set(-4, 9, 6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.radius = 9;
key.shadow.camera.left = -8; key.shadow.camera.right = 8; key.shadow.camera.top = 8; key.shadow.camera.bottom = -8;
scene.add(key);
const fill = new THREE.DirectionalLight('#ffffff', 0.7);
fill.position.set(6, 3, -2);
scene.add(fill);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.18 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// Matte vinyl: soft roughness, a little clearcoat sheen.
const vinyl = (color) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.48, metalness: 0, clearcoat: 0.35, clearcoatRoughness: 0.5, sheen: 0.3, sheenColor: new THREE.Color('#ffffff') });
const add = (mesh) => { mesh.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }); scene.add(mesh); return mesh; };
const label = (text, { bg = '#ffffff', fg = '#17140F', w = 512, h = 256, size = 150, font = 'Bagel Fat One' } = {}) => {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.fillStyle = bg; g.fillRect(0, 0, w, h);
  g.fillStyle = fg; g.font = `${size}px "${font}"`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, w / 2, h / 2 + 6);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
};

// Chess knight: a rounded silhouette extruded with a fat bevel, on a turned base.
const knight = new THREE.Group();
const s = new THREE.Shape();
s.moveTo(-0.62, 0);
s.lineTo(0.62, 0);
s.bezierCurveTo(0.68, 0.5, 0.44, 0.9, 0.5, 1.4);
s.bezierCurveTo(0.56, 1.85, 0.52, 2.3, 0.4, 2.62);
s.bezierCurveTo(0.36, 2.85, 0.3, 3.05, 0.2, 3.12);
s.bezierCurveTo(0.1, 3.06, 0.05, 2.9, 0.02, 2.76);
s.bezierCurveTo(-0.2, 2.78, -0.42, 2.66, -0.6, 2.46);
s.bezierCurveTo(-0.82, 2.2, -1.02, 2.0, -1.1, 1.76);
s.bezierCurveTo(-1.16, 1.52, -0.98, 1.34, -0.76, 1.42);
s.bezierCurveTo(-0.52, 1.5, -0.34, 1.44, -0.3, 1.26);
s.bezierCurveTo(-0.55, 0.95, -0.7, 0.5, -0.62, 0);
const body = new THREE.Mesh(new THREE.ExtrudeGeometry(s, { depth: 0.55, bevelEnabled: true, bevelThickness: 0.22, bevelSize: 0.16, bevelSegments: 10, curveSegments: 48 }), vinyl('#1FB3FF'));
body.position.set(0, 0.42, -0.27);
knight.add(body);
const base = new THREE.Mesh(new THREE.LatheGeometry([new THREE.Vector2(0, 0), new THREE.Vector2(0.95, 0), new THREE.Vector2(1.0, 0.08), new THREE.Vector2(0.98, 0.3), new THREE.Vector2(0.78, 0.38), new THREE.Vector2(0.7, 0.46), new THREE.Vector2(0, 0.46)], 64), vinyl('#1597d9'));
knight.add(base);
const eye = new THREE.Mesh(new THREE.SphereGeometry(0.09, 24, 16), new THREE.MeshPhysicalMaterial({ color: '#17140F', roughness: 0.3, clearcoat: 1 }));
eye.position.set(-0.36, 2.5, 0.44);
knight.add(eye);
const eye2 = eye.clone(); eye2.position.z = -0.43 - 0.0; knight.add(eye2);
knight.position.set(-1.6, 0, 0.2);
knight.rotation.y = 0.55;
knight.scale.setScalar(1.25);
add(knight);

// Cup and saucer.
const cup = new THREE.Group();
const saucer = new THREE.Mesh(new THREE.LatheGeometry([new THREE.Vector2(0, 0.02), new THREE.Vector2(1.05, 0.02), new THREE.Vector2(1.2, 0.14), new THREE.Vector2(1.15, 0.2), new THREE.Vector2(0, 0.12)], 64), vinyl('#ffffff'));
cup.add(saucer);
const mug = new THREE.Mesh(new THREE.LatheGeometry([new THREE.Vector2(0, 0.12), new THREE.Vector2(0.48, 0.14), new THREE.Vector2(0.7, 0.45), new THREE.Vector2(0.78, 1.0), new THREE.Vector2(0.74, 1.04), new THREE.Vector2(0.66, 0.98), new THREE.Vector2(0, 0.9)], 64), vinyl('#FF5C8A'));
cup.add(mug);
const coffee = new THREE.Mesh(new THREE.CircleGeometry(0.66, 48), new THREE.MeshStandardMaterial({ color: '#5a3424', roughness: 0.35 }));
coffee.rotation.x = -Math.PI / 2; coffee.position.y = 0.93; cup.add(coffee);
const handle = new THREE.Mesh(new THREE.TorusGeometry(0.26, 0.09, 20, 48), vinyl('#FF5C8A'));
handle.position.set(0.82, 0.62, 0); cup.add(handle);
cup.position.set(1.7, 0, -1.6);
cup.rotation.y = -0.4;
add(cup);

// Coin "CD" in pistachio.
const coin = new THREE.Group();
const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 0.26, 64), vinyl('#B6D31B'));
coin.add(rim);
const face = new THREE.Mesh(new THREE.CircleGeometry(0.66, 64), new THREE.MeshPhysicalMaterial({ map: label('100', { bg: '#c8e23a', size: 170, w: 512, h: 512 }), roughness: 0.5, clearcoat: 0.3 }));
face.rotation.x = -Math.PI / 2; face.position.y = 0.131; coin.add(face);
coin.position.set(1.25, 0.95, 1.35);
coin.rotation.set(0.55, 0.2, -0.35);
add(coin);

// Table tent "MASA07".
const tent = new THREE.Group();
const card = new RoundedBoxGeometry(1.7, 1.05, 0.08, 4, 0.06);
const faceMat = new THREE.MeshPhysicalMaterial({ map: label('MASA07', { size: 118, w: 640, h: 400 }), roughness: 0.55 });
const plain = vinyl('#ffffff');
const front = new THREE.Mesh(card, [plain, plain, plain, plain, faceMat, plain]);
front.position.set(0, 0.48, 0.17); front.rotation.x = -0.32; tent.add(front);
const back = new THREE.Mesh(card, plain); back.position.set(0, 0.48, -0.17); back.rotation.x = 0.32; tent.add(back);
tent.position.set(3.3, 0, 0.4);
tent.rotation.y = -0.55;
add(tent);

renderer.render(scene, camera);
document.fonts.load('150px "Bagel Fat One"').then(() => {
  faceMat.map = label('MASA07', { size: 118, w: 640, h: 400 }); faceMat.needsUpdate = true;
  face.material.map = label('100', { bg: '#c8e23a', size: 170, w: 512, h: 512 }); face.material.needsUpdate = true;
  renderer.render(scene, camera);
  window.__ready = true;
});
</script>
<style>@font-face{font-family:"Bagel Fat One";src:url(/bagel/files/bagel-fat-one-latin-400-normal.woff2) format("woff2")}</style>
</body>
</html>
