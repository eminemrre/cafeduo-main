name: Playwright Tests

# Push'taki e2e smoke artık CI/CD Pipeline (ci.yml) içinde koşuyor; burada
# tekrar koşmamak için push/PR trigger'ı kaldırıldı. Bu workflow nightly
# (schedule) ve manuel (workflow_dispatch) çalışır — advanced realtime dahil.
on:
  push:
    branches: ['security/game-authority-*']
  pull_request:
    branches: ['security/game-authority-*']
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  authority-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: cafeduo_authority_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: echo "Validated HEAD=$(git rev-parse HEAD) event=$GITHUB_EVENT_NAME"
      - run: npm ci
      - run: npm run quality
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - name: Validate Compose flag interpolation without starting containers
        run: |
          env -u GAME_ENGINE_V2_ENABLED docker compose -f deploy/docker-compose.dokploy.yml config --format json > /tmp/authority-default.json
          GAME_ENGINE_V2_ENABLED=true docker compose -f deploy/docker-compose.dokploy.yml config --format json > /tmp/authority-enabled.json
          node -e "const assert=require('node:assert/strict');assert.equal(require('/tmp/authority-default.json').services.api.environment.GAME_ENGINE_V2_ENABLED,'false');assert.equal(require('/tmp/authority-enabled.json').services.api.environment.GAME_ENGINE_V2_ENABLED,'true')"
      - name: Prepare disposable engine schema and test real PostgreSQL
        env:
          TEST_DATABASE_URL: postgres://postgres:disposable-ci-only@127.0.0.1:5432/cafeduo_authority_ci
          GAME_ENGINE_TEST_DB_APPROVED: '1'
        run: |
          node scripts/e2e/prepare-game-engine-db.cjs
          npx jest backend/gameEngine/settlement.postgres.test.js --runInBand --ci
  smoke-critical:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # Resmi Playwright imajı: tarayıcı + OS bağımlılıkları hazır (apt takılması yok).
    container:
      image: mcr.microsoft.com/playwright:v1.58.1-jammy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install chromium
      - name: Run smoke-critical Playwright tests
        run: npx playwright test --project=chromium --grep @smoke
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          E2E_API_BASE_URL: http://127.0.0.1:3001
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 30

  advanced-v2:
    # Full server-authoritative match flow. Production keeps the flag off;
    # this job starts an isolated E2E stack with it on.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.1-jammy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install chromium
      - name: Run protocol v2 Playwright tests
        run: npx playwright test --project=chromium --grep @v2
        env:
          GAME_ENGINE_V2_ENABLED: 'true'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          E2E_API_BASE_URL: http://127.0.0.1:3001
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-v2
          path: playwright-report/
          retention-days: 30

  advanced-realtime:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.1-jammy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install chromium
      - name: Run advanced realtime Playwright tests
        run: npx playwright test --project=chromium --grep @advanced
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          E2E_API_BASE_URL: http://127.0.0.1:3001
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-advanced
          path: playwright-report/
          retention-days: 30
